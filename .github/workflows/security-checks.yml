name: Security Checks
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  audit-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      # Production packages only (--omit=dev): the dev-tool chain eslint-config-next > braces has
      # an advisory with no patched version, and none of it ships to the live site (D-119).
      - name: npm audit (fails on high/critical vulnerabilities in production packages)
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
